services:
  email-finder:
    build: .
    container_name: mailscout-email-finder
    ports:
      - "9080:9080"
    environment:
      # Optimized performance settings for 1000 emails in ~1000 seconds
      - SMTP_TIMEOUT=2              # Fast timeout (was 10)
      - NUM_THREADS=100             # High parallelism (was 20)
      - NUM_BULK_THREADS=50         # Bulk thread pool (was 25)
      - BATCH_SIZE=100              # Process 100 at a time
      - CONNECTION_POOL_SIZE=100    # Large connection pool
      - MAX_RETRIES=1               # Minimal retries (was 3)
      - RETRY_DELAY=0.5             # Fast retry
      
    # Resource limits optimized for high throughput
    deploy:
      resources:
        limits:
          cpus: '4.0'               # More CPU for parallelism
          memory: 2G                # More memory for connections
        reservations:
          cpus: '2.0'
          memory: 1G
    
    # Restart policy
    restart: unless-stopped
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    # Network configuration
    networks:
      - email-finder-network

  # Optional: Add a reverse proxy (nginx) for production
  nginx:
    image: nginx:alpine
    container_name: mailscout-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro  # Add SSL certificates here if needed
    depends_on:
      - email-finder
    networks:
      - email-finder-network
    restart: unless-stopped
    profiles:
      - production  # Only start with --profile production

networks:
  email-finder-network:
    driver: bridge

volumes:
  # Add any persistent volumes here if needed
  logs:
    driver: local
