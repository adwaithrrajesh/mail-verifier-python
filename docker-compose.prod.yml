services:
  email-finder:
    build: .
    container_name: mailscout-email-finder-prod
    ports:
      - "8008:8008"
    environment:
      # Production settings
      - SMTP_TIMEOUT=15
      - NUM_THREADS=30
      - BATCH_SIZE=100
      - FLASK_ENV=production
      - LOG_LEVEL=INFO
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 2G
        reservations:
          cpus: '2.0'
          memory: 1G
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - email-finder-network
    volumes:
      - logs:/app/logs

  nginx:
    image: nginx:alpine
    container_name: mailscout-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - logs:/var/log/nginx
    depends_on:
      - email-finder
    networks:
      - email-finder-network
    restart: always

  # Optional: Add monitoring with Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: mailscout-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - email-finder-network
    restart: unless-stopped
    profiles:
      - monitoring

networks:
  email-finder-network:
    driver: bridge

volumes:
  logs:
    driver: local
  prometheus_data:
    driver: local
